  canvas { flex: 1 1 auto; width: 100%; min-height: 0; display: block; cursor: pointer; }
  footer { font-size: 0.95rem; color: var(--muted); }
  #hint { min-width: 0; }
  button { font: inherit; color: var(--muted); background: none; border: 1.5px solid currentColor; border-radius: 999px; padding: 4px 12px; cursor: pointer; flex: 0 0 auto; }
  button:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Kasa</h1>
    <span class="clock" id="clock">0,0</span>

  <div class="bar" id="bar"><i id="barFill"></i></div>
  <canvas id="c" aria-label="Oyun alanı. Dokunarak sıradaki halkayı kilitle."></canvas>
  <footer>

  const TEACH = { 1: 'Dokun, dış halkayı kilitle', 2: 'Sarı kama ortak açıklık. Sonraki boşluğu ona hizala', 3: 'Yıldızlar, kasa açıldığında kalan açıklığın genişliğine göre', 4: 'İpucu: ilk kilidi, ikinci halkanın boşluğu yaklaşırken vur' };
  const features = { preLocked: 'Kareli halka baştan kilitli, kanalın yönünü o belirler', gaps2: 'İki kapılı halka: hangi kapıyı kullandığın sonrakileri etkiler', flip: 'Kırmızı noktalı halkalar ara ara yön değiştirir', wobble: 'Bazı halkalar hızlanıp yavaşlıyor' };
  const firstSeen = {};
  LEVELS.forEach(l => {
    const has = { preLocked: l.rings.some(r => r.preLocked), gaps2: l.rings.some(r => r.gaps === 2), flip: l.rings.some(r => r.flip), wobble: l.rings.some(r => r.wobble) };
    for (const k in has) if (has[k] && !l.boss && !(k in firstSeen)) firstSeen[k] = l.n;
  });
  for (const k in firstSeen) if (!TEACH[firstSeen[k]]) TEACH[firstSeen[k]] = features[k];

  const fmt = t => t.toFixed(1).replace('.', ',');
  const starStr = s => '★'.repeat(s) + '☆'.repeat(3 - s);
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    ['bg','ink','ball','fail','win','muted'].forEach(k => colors[k] = cs.getPropertyValue('--' + k).trim());
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', readColors);

  function geo() {
    const S = Math.min(W, H) || 380;
    const outer = S * 0.44, inner = S * 0.17, n = rings.length;
    const step = n > 1 ? (outer - inner) / (n - 1) : 0;
    return { S, outer, inner, step, ballR: S * 0.022, radius: i => outer - i * step, lw: Math.max(5, Math.min(9, S * 0.018)) };
  }

  // Maske, en büyük açıklık, geçiş eşiği ve yıldız kuralı core.js'te; burada kopyası tutulmaz.
  const applyRing = r => { applyMask(mask, r); anyLocked = true; };
  const runs = () => maskRuns(mask);
  const largestRun = () => maskLargest(mask);
  function nextActive(from) { let i = from; while (i < rings.length && rings[i].locked) i++; return i; }

  function loadLevel(n, keepAttempts) {
    level = n; L = LEVELS[n - 1];
    rings = liveRings(L.rings);
    mask = newMask(); anyLocked = false;
    rings.forEach(r => { if (r.locked) applyRing(r); });
    active = nextActive(0); state = 'idle'; crashRing = -1; lastLocked = -1;
    levelTime = 0; endTimer = 0; ballDist = 0; flash = 0; shake = 0;
    if (!keepAttempts) attempts = 1;
    lvlEl.textContent = L.boss ? `${n}, patron` : n;
    const b = bests[n];
    if (L.boss && attempts === 1) hintEl.textContent = `${L.boss}: ${L.hint}`;
    else if (attempts > 1) hintEl.textContent = `Deneme ${attempts}` + (b ? `, en iyin ${starStr(b.s)}` : '');
    else if (TEACH[n] && !b) hintEl.textContent = TEACH[n];
    else hintEl.textContent = b ? `En iyin ${starStr(b.s)} ${fmt(b.t)} sn` : 'Dokun, sıradaki halkayı kilitle';
    try { localStorage.setItem('kasa2-level', String(n)); } catch (e) {}
    updateClock();
  }

  function crash(msg, ring) {
    state = 'crash'; crashRing = ring; flash = 1; shake = 1; endTimer = 0.9;
    hintEl.textContent = msg;
  }

  function tap() {
    if (state !== 'idle' || active >= rings.length) return;
    const r = rings[active];
    r.locked = true; lastLocked = active; lockPulse = 1;
    applyRing(r);
    const run = largestRun();
    if (!canPass(run.w)) { crash('Açıklık kapandı', active); return; }
    active = nextActive(active + 1);
    if (active >= rings.length) {
      state = 'fire'; fireAngle = run.center; ballDist = 0; finishTime = levelTime; endTimer = 1.4;
      // Hassasiyet: mükemmel hizada kalacak açıklığa göre ne kadarını koruyabildin
      const minGap = Math.min(...L.rings.map(x => x.gap)) * DEG;
      const q = starRatio(run.w, minGap);
      const s = starCount(q, DATA.q3, DATA.q2);
      const prev = bests[level];
      const better = !prev || s > prev.s || (s === prev.s && finishTime < prev.t);
      if (better) { bests[level] = { s, t: +finishTime.toFixed(2) }; try { localStorage.setItem('kasa2-best', JSON.stringify(bests)); } catch (e) {} }
      const label = s === 3 ? 'Temiz açılış' : s === 2 ? 'İyi açılış' : 'Kıl payı';
      hintEl.textContent = `${label} ${starStr(s)} ${fmt(finishTime)} sn${better && prev ? ', rekor' : ''}`;
    }
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
  window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tap(); } });
  document.getElementById('reset').addEventListener('click', e => { e.stopPropagation(); loadLevel(1); });

  function updateClock() {
    const shown = state === 'fire' ? finishTime : levelTime;
    const left = Math.max(0, L.limit - shown);
    clockEl.textContent = fmt(left);
    const low = left < L.limit * 0.25;
    clockEl.classList.toggle('low', low); barEl.classList.toggle('low', low);
    barFill.style.transform = `scaleX(${left / L.limit})`;
  }

  function update(dt) {
    if (state === 'idle') {
      levelTime += dt;
      stepRings(rings, dt, levelTime);
      if (levelTime >= L.limit) crash('Süre doldu', -2);
    } else if (state === 'fire') {
      ballDist += geo().S * 1.3 * dt;
      endTimer -= dt;
      if (flash === 0 && endTimer > 0.6 && ballDist > geo().outer) flash = 1;
      if (endTimer <= 0) loadLevel(Math.min(level + 1, MAX_LEVEL));
    } else if (state === 'crash') {
      endTimer -= dt;
      if (endTimer <= 0) { attempts++; loadLevel(level, true); }
    }
    flash = Math.max(0, flash - dt * 2);
    shake = Math.max(0, shake - dt * 3);
    lockPulse = Math.max(0, lockPulse - dt * 4);
    updateClock();
  }

  function drawRing(r, R) {
    const half = r.gap * DEG / 2;
    const cs = gapCenters(r).map(c => ((c % TAU) + TAU) % TAU).sort((a, b) => a - b);
    for (let i = 0; i < cs.length; i++) {
      const a0 = cs[i] + half;
      const a1 = (i + 1 < cs.length ? cs[i + 1] : cs[0] + TAU) - half;
      if (a1 > a0) { ctx.beginPath(); ctx.arc(0, 0, R, a0, a1); ctx.stroke(); }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const g = geo();
    const sx = shake ? (Math.random() - 0.5) * 12 * shake : 0;
    const sy = shake ? (Math.random() - 0.5) * 12 * shake : 0;
    ctx.save(); ctx.translate(W / 2 + sx, H / 2 + sy);

    ctx.globalAlpha = L.boss ? 0.14 : 0.07; ctx.fillStyle = L.boss ? colors.ball : colors.ink;
    ctx.font = `600 ${g.S * 0.5}px Fredoka, "Trebuchet MS", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(level, 0, g.S * 0.03);
    ctx.globalAlpha = 1;

    if (anyLocked && state !== 'crash') {
      for (const run of runs()) {
        const wide = canPass(run.w);
        ctx.fillStyle = wide ? colors.ball : colors.fail;
        ctx.globalAlpha = wide ? 0.22 : 0.15;
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, g.outer + g.S * 0.05, run.from, run.to); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Sıradaki halka belirgin, daha sonrakiler yarı saydam: ileriyi okumak mümkün
    const upcoming = state === 'idle' ? nextActive(active + 1) : -1;
    ctx.lineCap = 'round';
    rings.forEach((r, i) => {
      const R = g.radius(i);
      let col = colors.ink, alpha = r.locked ? 1 : 0.4, lw = g.lw;
      if (i === upcoming) alpha = 0.75;
      if (i === active && state === 'idle') { col = colors.ball; alpha = 1; lw = g.lw * 1.25; }
      if (i === crashRing || crashRing === -2) { col = colors.fail; alpha = 1; }
      if (i === lastLocked && lockPulse > 0) lw = g.lw * (1 + lockPulse * 0.8);
      ctx.strokeStyle = col; ctx.globalAlpha = alpha; ctx.lineWidth = lw;
      drawRing(r, R);
      ctx.globalAlpha = 1;
      const a = r.angle + Math.PI;
      if (r.preLocked) { ctx.fillStyle = colors.ink; ctx.fillRect(Math.cos(a) * R - 4, Math.sin(a) * R - 4, 8, 8); }
      if (r.flip && !r.locked) { ctx.fillStyle = colors.fail; ctx.beginPath(); ctx.arc(Math.cos(a) * R, Math.sin(a) * R, 4, 0, TAU); ctx.fill(); }
    });

    const d = state === 'fire' ? ballDist : 0;
    ctx.fillStyle = state === 'crash' ? colors.fail : colors.ball;
    ctx.beginPath(); ctx.arc(Math.cos(fireAngle) * d, Math.sin(fireAngle) * d, g.ballR, 0, TAU); ctx.fill();
    ctx.restore();

    if (flash > 0) {
      ctx.globalAlpha = flash * 0.18;
      ctx.fillStyle = state === 'crash' ? colors.fail : colors.win;
      ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    }
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = cv.getBoundingClientRect();
    W = rect.width; H = rect.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  readColors();
  window.addEventListener('resize', resize);
  resize();
  loadLevel(level);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
